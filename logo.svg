<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="100%" stop-color="#010409" />
    </radialGradient>

    <!-- Wing & Primary Elements Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>

    <!-- Accent / Code Light Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Core Glow Effect -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Dark Canvas -->
  <rect width="800" height="600" fill="url(#bg)" />

  <!-- Central Graphic Group -->
  <g transform="translate(400, 230)">
    
    <!-- Outer Flight Wings (V-Formation Squadron Theme) -->
    <!-- Left Wing Layers -->
    <path d="M -15 -10 L -130 -100 L -110 -40 L -15 35 Z" fill="url(#primaryGrad)" />
    <path d="M -15 25 L -100 -25 L -85 10 L -15 65 Z" fill="url(#primaryGrad)" opacity="0.8" />
    <path d="M -15 55 L -70 15 L -60 40 L -15 85 Z" fill="url(#primaryGrad)" opacity="0.5" />

    <!-- Right Wing Layers -->
    <path d="M 15 -10 L 130 -100 L 110 -40 L 15 35 Z" fill="url(#primaryGrad)" />
    <path d="M 15 25 L 100 -25 L 85 10 L 15 65 Z" fill="url(#primaryGrad)" opacity="0.8" />
    <path d="M 15 55 L 70 15 L 60 40 L 15 85 Z" fill="url(#primaryGrad)" opacity="0.5" />

    <!-- Bottom Shield / Chevron Join -->
    <path d="M 0 120 L -35 50 L 0 70 L 35 50 Z" fill="url(#primaryGrad)" filter="url(#glow)" />

    <!-- Center Tech Core: Clean Code Brackets (No Cursor) -->
    <g transform="translate(0, 10)" filter="url(#glow)">
      <!-- Central Glowing Node/Core -->
      <circle cx="0" cy="0" r="8" fill="#ffffff" />

      <!-- Left Bracket '<' -->
      <path d="M -35 -25 L -55 0 L -35 25" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Right Bracket '>' -->
      <path d="M 35 -25 L 55 0 L 35 25" fill="none" stroke="url(#accentGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
      
      <!-- Center Slash '/' -->
      <line x1="12" y1="-28" x2="-12" y2="28" stroke="url(#accentGrad)" stroke-width="5" stroke-linecap="round" opacity="0.9" />
    </g>

  </g>

  <!-- Typography -->
  <g text-anchor="middle">
    <!-- Brand Name -->
    <text x="400" y="445" 
          fill="#ffffff" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="48" 
          font-weight="900" 
          letter-spacing="10">SQUADRON</text>

    <!-- Subtitle / Tagline -->
    <text x="400" y="485" 
          fill="#0284c7" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="14" 
          font-weight="600" 
          letter-spacing="4">AUTONOMOUS ISSUE-TO-CODE ENGINE</text>
  </g>
</svg>
